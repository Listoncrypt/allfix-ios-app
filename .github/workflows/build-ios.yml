name: Build iOS (iPhone) App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ios:
    name: Compile iOS .ipa on Apple Silicon Runner
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Check Flutter Environment
        run: flutter doctor -v

      - name: 5. Fetch Dart & Flutter Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          # Upgrade shared_preferences_foundation to 2.6.1+ to fix Swift trailing-comma
          # compiler errors (Unexpected ',' separator) on Xcode 16 / macos-15
          flutter pub upgrade shared_preferences_foundation

      - name: 6. Diagnose CocoaPods & Xcode Targets
        run: |
          echo "=== CocoaPods version ==="
          pod --version
          echo "=== Xcode project targets ==="
          xcodebuild -list -project ios/Runner.xcodeproj 2>&1 || true
          echo "=== Podfile targets ==="
          grep -E "^target" ios/Podfile || true

      - name: 7. Build iOS Release Bundle (No Code-Sign)
        run: flutter build ios --release --no-codesign

      - name: 8. Package into .ipa Installer
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -q ALLFIX_iOS.ipa Payload
          echo "Package completed: ALLFIX_iOS.ipa"

      - name: 9. Upload ALLFIX .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALLFIX-iOS-iPhone-Package
          path: ALLFIX_iOS.ipa
          retention-days: 14
          if-no-files-found: error

      - name: 10. Compress and Upload Runner.app for Xcode/TestFlight
        run: |
          cd build/ios/iphoneos
          zip -r -q Runner.app.zip Runner.app
        continue-on-error: true

      - name: 11. Upload Runner.app.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALLFIX-Runner-App-Bundle
          path: build/ios/iphoneos/Runner.app.zip
          retention-days: 14
          if-no-files-found: warn
