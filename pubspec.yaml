name: allfix_app
description: "ALLFIX Services Xpress — Dedicated coordination bridge for verified artisans, vehicles & real estate in Nigeria."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & Real-time
  dio: ^5.4.3
  supabase_flutter: ^2.5.6

  # Navigation
  go_router: ^14.1.4

  # UI & Media
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Device & Communication
  url_launcher: ^6.2.6
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
